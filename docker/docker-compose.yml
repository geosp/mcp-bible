name: mcp-bible

services:
  mcp-bible:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/app
    working_dir: /app
    command: ["--from", ".", "mcp-bible", "--mode", "http", "--no-auth"]
    ports:
      - "3018:3000"
    environment:
      - UV_CACHE_DIR=/tmp/uv-cache
    restart: unless-stopped
