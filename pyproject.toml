[project]
name = "mcp-bible"
version = "2.0.0"
description = "Bible MCP server built on mcp-service-kit"
requires-python = ">=3.11"
authors = [
    {name = "Geovanny F. Fajardo", email = "gffajardo@gmail.com"},
]
dependencies = [
    # MCP server infrastructure (stdio/HTTP transports, CLI, config)
    "mcp-service-kit @ git+https://github.com/geosp/mcp-service-kit@v0.2.1",
    # Web scraping and HTTP client
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
mcp-bible = "mcp_bible.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
